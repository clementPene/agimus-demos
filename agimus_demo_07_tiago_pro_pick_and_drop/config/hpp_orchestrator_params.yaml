---
# HPP orchestrator parameters for the TIAGo Pro pick-and-drop demo (fixed base).
#
# State space (nv=7): 7 left arm joints.
# Config space (nq=7+7=14 without freeflyer; object adds 7 DOF).

# ── Trajectory sampling ───────────────────────────────────────────────────────
trajectory:
  dt: 0.01          # sampling period (s) — must match agimus_controller rate
  time_scale: 1.6   # stretch HPP path time further so the arm settles with less overshoot while keeping the same final pose
  carry_time_scale: 1.3   # faster than time_scale so p3 does not drag in Gazebo, but not as fast as 1.0 — gives the controller more margin to track the carry motion (1.0 was seen to intermittently lose tracking)

# ── Configurable T-LESS object ───────────────────────────────────────────────
# Shipped object assets: obj_01, obj_20, obj_21, obj_22, obj_23, obj_23,
# obj_26, obj_31.
object:
  # Fallback object when no /happypose/detections message arrives at startup
  # (e.g. camera/vision not running yet). When a detection is available, the
  # orchestrator identifies the present object from its class_id instead —
  # see Orchestrator._detect_present_object() in orchestrator.py.
  name: "obj_23"
  # The orchestrator resolves the URDF/SRDF from object.name.
  # Bare resource names are auto-qualified to <object.name>/... inside HPP.
  link: "base_link"
  # Grasp candidates come straight from whatever handles are defined in the
  # object's SRDF (see obj_23.srdf's goal_handle_up/goal_handle_down) — the
  # planner tries each one and picks whichever actually plans, so this needs
  # no per-object handle list here. This generalizes to any T-LESS object.
  handle_clearance: 0.05
  # Object centre position in robot base_link frame.
  # Table is 0.5 m in front of robot; object centered on table.
  # Update z when switching object if its base_link origin sits at a different
  # height relative to the support surface.
  x: 0.55
  y: 0.0
  z: 0.768   # 0.745 + 0.023

# ── Arm tuck configurations (same as demo_07_fixed) ──────────────────────────
tuck:
  left_arm:  [2.8, -1.81, -0.56, -2.20, -2.6, 0.91, -0.26]
  right_arm: [-2.8, -1.81, 0.56, -2.20, 2.6, 0.91, 0.26]

# ── Carry-position arm configuration ─────────────────────────────────────────
# Joint values for arm_left_1 … arm_left_7 the arm holds while the object is
# in transit — reached right after grasping and held through navigation,
# before the arm moves on to hover above the drop-zone box for placement
# (see box: below — that target is computed via IK, not hardcoded here).
# PLACEHOLDER (same as tuck.left_arm) — adjust for your specific setup.
carry:
  arm_config: [2.8, -2.12, 2.35, -2.20, -2.6, 0.91, -0.26]

# ── Navigation target (base move between carry and place) ───────────────────
# Pose sent to the navigate_to_pose action between the carry phase (p3) and
# the place/release phase (gripper open + p4). PLACEHOLDER — fill in with the
# real drop-zone pose (map frame) once the location is known.
nav:
  target_pose:
    frame_id: "map"
    x: 0.0
    y: 0.0
    yaw: 0.0
  # Pose the base returns to after retracting from the drop zone (Phase 4),
  # so a new pick-and-drop cycle can start from the same place. PLACEHOLDER —
  # fill in with the real pick-location pose (map frame) once known.
  initial_pose:
    frame_id: "map"
    x: 0.0
    y: 0.0
    yaw: 0.0

# ── Drop-zone container ───────────────────────────────────────────────────
# A box the object is released into during p_place. This IS the source of
# truth for where p_place ends up — the arm config there is solved via IK
# (Orchestrator._find_drop_config) to put the grasped object `clearance`
# above the box's rim, not the other way around: move the box here and
# p_place follows, no manual arm-config retuning needed. Collision-relevant
# for p_place/p4/p5 (near the drop zone) only — p1/p2/p3 (near the pick
# location) explicitly ignore it. Wall/bottom thickness and inner opening
# are in urdf/box.urdf and must be kept in sync there if changed, same as
# table.urdf's own hardcoded dimensions.
#
# x/y/z are the box's bottom-outer surface (base_link origin in box.urdf),
# in robot base_link frame. PLACEHOLDER — this puts it resting on the
# table (z = table top surface, 0.745m — see table.srdf) beside the pick
# spot (object.x/y is the pick location); fill in the real container
# position once known.
box:
  x: 0.55
  y: 0.3
  z: 0.745
  # How far above the box's rim the grasped object should end up when
  # p_place completes.
  clearance: 0.05

# ── MPC weights ───────────────────────────────────────────────────────────────
weights:
  w_q:           [0.60, 0.60, 0.60, 0.60, 0.60, 0.60, 0.60]         # keep the arm closer to the planned IK posture so it does not hunt in redundant joint space
  w_qdot:        [0.05, 0.05, 0.05, 0.05, 0.05, 0.05, 0.05]         # increase velocity damping so contact and final settling are less oscillatory
  w_qddot:       [0.08, 0.08, 0.08, 0.08, 0.08, 0.08, 0.08]         # penalize sharp acceleration reversals that show up as vibration
  w_effort:      [0.006, 0.006, 0.006, 0.006, 0.006, 0.006, 0.006]  # limit corrective torque spikes while keeping the end-effector target precise
  w_collision:   0.0
  w_frame_trans: [1000.0, 1000.0, 1000.0]                               # tighten translational alignment so the gripper lands closer to the planned grasp pose
  w_frame_rot:   [60.0, 60.0, 60.0]                                  # keep wrist alignment firm without driving small orientation oscillations
  # w_q:           [0.001, 0.001, 0.001, 0.001, 0.001, 0.001, 0.001]
  # w_qdot:        [0.01,  0.01,  0.01,  0.01,  0.01,  0.01,  0.01 ]
  # w_qddot:       [0.001, 0.001, 0.001, 0.001, 0.001, 0.001, 0.001]
  # w_effort:      [0.01,   0.01,   0.01,   0.01,   0.01,   0.01,   0.01  ]
  # w_collision:   0.0
  # w_frame_trans: [10000.0, 10000.0, 10000.0]
  # w_frame_rot:   [5.0, 5.0, 5.0]
