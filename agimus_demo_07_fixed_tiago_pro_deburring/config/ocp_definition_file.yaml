---
# OCP definition for the TIAGo Pro deburring demo.
# Task-space priority: frame tracking dominates, state_reg is a first guess only.

running_model:
  class: IAMSoftContactAugmented
  # |f| box constraint, tool z (N). Re-added 2026-08-28 with the two fixes
  # the 20260827_151542 divergence needed:
  #  - GATED: agimus_controller enables it (iam.with_force_constraint) only
  #    while the sensor reports contact (contact.active, itself quasi-static
  #    gated). While off, f is frozen/decoupled and unconstrained, so a
  #    noisy x0.f can't be an unfixable infeasibility.
  #  - x0.f is hard-clamped (_CONTACT_FORCE_CLAMP_N) before it enters the state.
  # Low for the first robot test — raise once behaviour is confirmed.
  force_lb: [-15.0]
  force_ub: [15.0]
  differential:
    class: DAMSoftContactAugmentedFwdDynamics
    # Soft contact model. Kp=9000/Kv=300 (not Franka's placeholders
    # Kp=6000/Kv=100) — matches the standalone tiago_pro_force_mpc_sim
    # MuJoCo testbed's "current best result" config.yaml. Kv in particular
    # was found there to be the single biggest lever (Kv=100 gave a
    # sharp/non-monotonic weight landscape; Kv=300 made every other
    # cost-weight sweep smooth and monotonic — see that project's NOTES.md).
    # Still simulation-derived, not re-tuned against the real contact —
    # start cautious on robot.
    # Sized to 1 (not 3, unlike Franka's 3D config): with enabled_directions
    # summing to 1, ocp_croco_generic_force_feedback.py's _dam_cls_and_kwargs
    # switches to force_feedback_mpc.DAMSoftContact1DAugmentedFwdDynamics,
    # which requires Kp/Kv of size 1 — passed through from here unsliced, no
    # Python-side truncation happens. Missing this crashed
    # DAMSoftContactAbstractAugmentedFwdDynamics's C++ constructor with
    # "Kp and Kv must have size 1" (2026-08-21).
    Kp: [4000]
    Kv: [400]
    # Must match force_sensor_filter.py's contact_name / agimus_controller.py's
    # _FORCE_CONTACT_NAME (project_demo07_force_feedback_scoping memory).
    frame_id: wrist_right_ft_sensor_link
    # Contact point = tool tip, computed via FK from the real URDF (2026-08-20):
    # wrist_right_ft_sensor_link -> gripper_right_tool_holder = 0.147928m (z,
    # identity rotation) + 0.04m tool length (Ø40x40mm pal-atc deburring bit).
    # NOT the same as the calibrated com_xyz (mass-weighted CoM, dominated by
    # the pal-atc coupler close to the sensor) — this is the geometric contact
    # point at the far end of the tool.
    oPc: [0.0, 0.0, 0.187928]
    with_gravity_torque_reg: true
    # 1D contact along the tool's own pushing axis (confirmed with Clément
    # 2026-08-21) — this is wrist_right_ft_sensor_link's local z (verified by
    # FK: gripper_right_tool_holder sits at identity rotation from the sensor
    # frame, i.e. the whole tool-mount chain extends along that same local
    # z). Needs ref: LOCAL (not LOCAL_WORLD_ALIGNED) for "z" to mean the
    # tool's pushing direction rather than world-vertical, which would only
    # coincide with the real contact direction if the wrist happened to be
    # perfectly vertical during insertion.
    enabled_directions: [false, false, true]
    ref: LOCAL
    cost_ref: LOCAL
    costs:
    - name: state_reg
      update: true
      weight: 1.0
      cost:
        class: CostModelResidual
        activation:
          class: ActivationModelWeightedQuad
          weights: 1.0
        residual:
          class: ResidualModelState
    # No control_reg here (ResidualModelControl, torque-toward-zero) on top
    # of with_gravity_torque_reg (torque-toward-gravity-comp): the two pull
    # commanded torque toward two different references at once, which the
    # tiago_pro_force_mpc_sim MuJoCo testbed confirmed reliably breaks force
    # tracking — a production code comment already suspected this exact
    # combo contributed to the 2026-08-21 real overshoot incident.
    - name: frame_trans_tracking_tool
      update: true
      weight: 1.0
      cost:
        class: CostModelResidual
        activation:
          class: ActivationModelWeightedQuad
          weights: 1.0
        residual:
          class: ResidualModelFrameTranslationStatic
          frame_id: gripper_right_tool_holder
    - name: frame_rot_tracking_tool
      update: true
      weight: 1.0
      cost:
        class: CostModelResidual
        activation:
          class: ActivationModelWeightedQuad
          weights: 1.0
        residual:
          class: ResidualModelFrameRotationStatic
          frame_id: gripper_right_tool_holder
    # NOTE: `nullspace_vel_damping` (ResidualModelNullspaceVelocity) was tested
    # here (bag 20260902_092617) — it halved the phantom velocity but doubled the
    # redundant-DOF posture drift (0.20 -> 0.43 rad) and cost +2.4 ms solve.
    # Reverted; the class stays in ocp_croco_generic.py, dormant.

terminal_model:
  class: IAMSoftContactAugmented
  # See running_model — gated |f| box.
  force_lb: [-15.0]
  force_ub: [15.0]
  differential:
    class: DAMSoftContactAugmentedFwdDynamics
    # See running_model.differential — sized to 1, not 3 (1D contact).
    Kp: [4000]
    Kv: [400]
    frame_id: wrist_right_ft_sensor_link
    oPc: [0.0, 0.0, 0.187928]
    with_gravity_torque_reg: false
    # See running_model.differential — same 1D tool-axis contact.
    enabled_directions: [false, false, true]
    ref: LOCAL
    cost_ref: LOCAL
    costs:
    - name: state_reg
      update: true
      weight: 1.0
      cost:
        class: CostModelResidual
        activation:
          class: ActivationModelWeightedQuad
          weights: 1.0
        residual:
          class: ResidualModelState
    - name: frame_trans_tracking_tool
      update: true
      weight: 1.0
      cost:
        class: CostModelResidual
        activation:
          class: ActivationModelWeightedQuad
          weights: 1.0
        residual:
          class: ResidualModelFrameTranslationStatic
          frame_id: gripper_right_tool_holder
    - name: frame_rot_tracking_tool
      update: true
      weight: 1.0
      cost:
        class: CostModelResidual
        activation:
          class: ActivationModelWeightedQuad
          weights: 1.0
        residual:
          class: ResidualModelFrameRotationStatic
          frame_id: gripper_right_tool_holder
    constraints:
      # arm_right_3_link_sc vs pylone capsules
    - name: collision_arm3_pyl0
      active: false
      constraint:
        class: ConstraintModelResidual
        lower: 0.001
        upper: inf
        residual:
          class: ResidualDistanceCollision
          collision_pair: [arm_right_3_link_sc_capsule_0, pylone_sc_link_capsule_0]
    - name: collision_arm3_pyl1
