---
# OCP definition for the TIAGo Pro deburring demo.
# Task-space priority: frame tracking dominates, state_reg is a first guess only.

running_model:
  class: IntegratedActionModelEuler
  differential:
    class: DifferentialActionModelFreeFwdDynamics
    costs:
    - name: state_reg
      update: true
      weight: 1.0
      cost:
        class: CostModelResidual
        activation:
          class: ActivationModelWeightedQuad
          weights: 1.0
        residual:
          class: ResidualModelState
    # Regularise the joint torque toward the *gravity-compensation* torque g(q)
    # (r = u - g(q)), not toward zero. The LFC on TIAGo Pro does NOT strip gravity
    # (`remove_gravity_compensation_effort: false`), so the OCP `u` is the full
    # joint torque and `ResidualModelControl` (-> 0) was actively fighting the
    # gravity load the OCP itself must produce -> static posture bias + rest u_fb
    # offset. Matches the Franka deburring demo (`with_gravity_torque_reg: true`).
    - name: control_reg
      update: true
      weight: 1.0
      cost:
        class: CostModelResidual
        activation:
          class: ActivationModelWeightedQuad
          weights: 1.0
        residual:
          class: ResidualModelControlGrav
    - name: frame_trans_tracking_tool
      update: true
      weight: 1.0
      cost:
        class: CostModelResidual
        activation:
          class: ActivationModelWeightedQuad
          weights: 1.0
        residual:
          class: ResidualModelFrameTranslationStatic
          frame_id: gripper_right_tool_holder
    - name: frame_rot_tracking_tool
      update: true
      weight: 1.0
      cost:
        class: CostModelResidual
        activation:
          class: ActivationModelWeightedQuad
          weights: 1.0
        residual:
          class: ResidualModelFrameRotationStatic
          frame_id: gripper_right_tool_holder
    # NOTE: `nullspace_vel_damping` (ResidualModelNullspaceVelocity) was tested
    # here (bag 20260902_092617) — it halved the phantom velocity but doubled the
    # redundant-DOF posture drift (0.20 -> 0.43 rad) and cost +2.4 ms solve.
    # Reverted; the class stays in ocp_croco_generic.py, dormant.

terminal_model:
  class: IntegratedActionModelEuler
  differential:
    class: DifferentialActionModelFreeFwdDynamics
    costs:
    - name: state_reg
      update: true
      weight: 1.0
      cost:
        class: CostModelResidual
        activation:
          class: ActivationModelWeightedQuad
          weights: 1.0
        residual:
