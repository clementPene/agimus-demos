---
# Same as ocp_definition_file_nonaugmented.yaml, plus one extra cost:
# nullspace_pos_damping (ResidualModelNullspacePosition, new 2026-09-09).
# Isolates this one new lever -- everything else is byte-identical to the
# plain non-augmented file, so a run here is directly comparable to the
# nonaug_vf* runs from the velocity_filter_nonaugmented campaign.
#
# `weight: 30.0` is the starting point ResidualModelNullspaceVelocity used
# (untested for the position version -- may need retuning either way).
#
# ROBOT-VALIDATED BASELINE (nonaug_horizon_ff_campaign, 2026-09-10/11):
# healthy OCP prediction (|v_pred[node1]| ~0.38 rad/s at rest, terminal
# drift ~0.045 rad, solve ~5ms) and a stable fast loop, with these
# hpp_orchestrator_params.yaml / agimus_controller_params.yaml /
# linear_feedback_controller_params.yaml values -- this file alone does
# NOT carry them, they live in those separate (shared, still-moving) files:
#   w_q: 1.0            w_frame_trans: [1000, 1000, 1000]
#   w_qdot: 0.2          w_frame_rot:   [500, 500, 500]
#   w_effort: 0.001      w_nullspace_pos: 30.0
#   dt: 0.01  horizon_size: 30  dt_factor_n_seq: n_steps=[30] factors=[1]
#   apply_knot: 0
#   feedback_gain_scale: 1.0 (0.5-1.0 stable; below 0.5 the SEA-arm fast
#     loop rings, at 0.0 it diverges catastrophically in <50ms -- see
#     plot/runs/nonaug_horizon_ff_campaign/README.md)
# Before trusting a run against this file, check hpp_orchestrator_params.yaml's
# w_qdot in particular -- it gets flipped back to 0.001 for the augmented
# (production) OCP work and the two are easy to mix up.

running_model:
  class: IntegratedActionModelEuler
  differential:
    class: DifferentialActionModelFreeFwdDynamics
    costs:
    - name: state_reg
      update: true
      weight: 1.0
      cost:
        class: CostModelResidual
        activation:
          class: ActivationModelWeightedQuad
          weights: 1.0
        residual:
          class: ResidualModelState
    - name: control_reg
      update: true
      weight: 1.0
      cost:
        class: CostModelResidual
        activation:
          class: ActivationModelWeightedQuad
          weights: 1.0
        residual:
          class: ResidualModelControlGrav
    - name: frame_trans_tracking_tool
      update: true
      weight: 1.0
      cost:
        class: CostModelResidual
        activation:
          class: ActivationModelWeightedQuad
          weights: 1.0
        residual:
          class: ResidualModelFrameTranslationStatic
          frame_id: gripper_right_tool_holder
    - name: frame_rot_tracking_tool
      update: true
      weight: 1.0
      cost:
        class: CostModelResidual
        activation:
          class: ActivationModelWeightedQuad
          weights: 1.0
        residual:
          class: ResidualModelFrameRotationStatic
          frame_id: gripper_right_tool_holder
    # New lever under test (see ocp_croco_generic.py's
    # ResidualModelNullspacePosition docstring): pulls the redundant DOF
    # toward the planned reference posture, restricted to the null space of
    # the tool frame's Jacobian -- doesn't fight the task, doesn't confuse
    # "wanted correction" with "drift" the way the velocity version did.
    - name: nullspace_pos_damping
      update: true
      weight: 1.0
      cost:
        class: CostModelResidual
        activation:
          class: ActivationModelWeightedQuad
          weights: 1.0
        residual:
          class: ResidualModelNullspacePosition
          frame_id: gripper_right_tool_holder
          damping: 1.0e-3
          weight: 30.0  # fallback, overridden by hpp_orchestrator_params.yaml's w_nullspace_pos

terminal_model:
