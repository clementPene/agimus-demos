---
# Same as ocp_definition_file_nonaugmented.yaml, plus one extra cost:
# nullspace_pos_damping (ResidualModelNullspacePosition, new 2026-09-09).
# Isolates this one new lever -- everything else is byte-identical to the
# plain non-augmented file, so a run here is directly comparable to the
# nonaug_vf* runs from the velocity_filter_nonaugmented campaign.
#
# `weight: 30.0` is the starting point ResidualModelNullspaceVelocity used
# (untested for the position version -- may need retuning either way).

running_model:
  class: IntegratedActionModelEuler
  differential:
    class: DifferentialActionModelFreeFwdDynamics
    costs:
    - name: state_reg
      update: true
      weight: 1.0
      cost:
        class: CostModelResidual
        activation:
          class: ActivationModelWeightedQuad
          weights: 1.0
        residual:
          class: ResidualModelState
    - name: control_reg
      update: true
      weight: 1.0
      cost:
        class: CostModelResidual
        activation:
          class: ActivationModelWeightedQuad
          weights: 1.0
        residual:
          class: ResidualModelControlGrav
    - name: frame_trans_tracking_tool
      update: true
      weight: 1.0
      cost:
        class: CostModelResidual
        activation:
          class: ActivationModelWeightedQuad
          weights: 1.0
        residual:
          class: ResidualModelFrameTranslationStatic
          frame_id: gripper_right_tool_holder
    - name: frame_rot_tracking_tool
      update: true
      weight: 1.0
      cost:
        class: CostModelResidual
        activation:
          class: ActivationModelWeightedQuad
          weights: 1.0
        residual:
          class: ResidualModelFrameRotationStatic
          frame_id: gripper_right_tool_holder
    # New lever under test (see ocp_croco_generic.py's
    # ResidualModelNullspacePosition docstring): pulls the redundant DOF
    # toward the planned reference posture, restricted to the null space of
    # the tool frame's Jacobian -- doesn't fight the task, doesn't confuse
    # "wanted correction" with "drift" the way the velocity version did.
    - name: nullspace_pos_damping
      update: true
      weight: 1.0
      cost:
        class: CostModelResidual
        activation:
          class: ActivationModelWeightedQuad
          weights: 1.0
        residual:
          class: ResidualModelNullspacePosition
          frame_id: gripper_right_tool_holder
          damping: 1.0e-3
          weight: 30.0

