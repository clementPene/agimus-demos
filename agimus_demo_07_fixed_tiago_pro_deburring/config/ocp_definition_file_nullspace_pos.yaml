---
# ocp_definition_file.yaml (production, augmented [q,v,f] soft-contact) plus
# the nullspace_pos_damping cost (ResidualModelNullspacePosition). weight 30,
# untuned. TEMPORARY test config -- revert definition_yaml_file to
# ocp_definition_file.yaml after.

running_model:
  class: IAMSoftContactAugmented
  # |f| box constraint (tool z, N). agimus_controller only enables it while
  # the sensor reports contact; low for now, raise once confirmed on robot.
  force_lb: [-15.0]
  force_ub: [15.0]
  differential:
    class: DAMSoftContactAugmentedFwdDynamics
    # Kp/Kv from the tiago_pro_force_mpc_sim MuJoCo testbed (sim-derived, not
    # re-tuned on the real contact). Size 1 = 1D contact (enabled_directions).
    Kp: [4000]
    Kv: [400]
    # Must match force_sensor_filter.py's contact_name / _FORCE_CONTACT_NAME.
    frame_id: wrist_right_ft_sensor_link
    # Tool tip: FK wrist_right_ft_sensor_link -> gripper_right_tool_holder
    # (0.147928 z) + 0.04 tool length.
    oPc: [0.0, 0.0, 0.187928]
    # Cost term regularising u -> g(q) (a ResidualModelControlGrav baked into
    # the DAM, ~1ms cheaper). Needed on TIAGo -- nothing strips gravity, so u
    # is the full torque. Terminal keeps it false (there it's a posture cost).
    with_gravity_torque_reg: true
    # 1D contact on the tool's pushing axis = the sensor frame's local z
    # (identity rotation to the tool). Needs ref: LOCAL for "z" to mean that.
    enabled_directions: [false, false, true]
    ref: LOCAL
    cost_ref: LOCAL
    costs:
    - name: state_reg
      update: true
      weight: 1.0
      cost:
        class: CostModelResidual
        activation:
          class: ActivationModelWeightedQuad
          weights: 1.0
        residual:
          class: ResidualModelState
    # No control_reg cost -- with_gravity_torque_reg above covers it, and
    # stacking the two breaks force tracking (testbed).
    - name: frame_trans_tracking_tool
      update: true
      weight: 1.0
      cost:
        class: CostModelResidual
        activation:
          class: ActivationModelWeightedQuad
          weights: 1.0
        residual:
          class: ResidualModelFrameTranslationStatic
          frame_id: gripper_right_tool_holder
    - name: frame_rot_tracking_tool
      update: true
      weight: 1.0
      cost:
        class: CostModelResidual
        activation:
          class: ActivationModelWeightedQuad
          weights: 1.0
        residual:
          class: ResidualModelFrameRotationStatic
          frame_id: gripper_right_tool_holder
    # Pulls the redundant DOF toward the planned posture, in the null space
    # of the tool Jacobian. See ocp_croco_generic.py.
    - name: nullspace_pos_damping
      update: true
      weight: 1.0
      cost:
        class: CostModelResidual
        activation:
          class: ActivationModelWeightedQuad
          weights: 1.0
        residual:
          class: ResidualModelNullspacePosition
          frame_id: gripper_right_tool_holder
          damping: 1.0e-3
          weight: 30.0  # fallback, overridden by hpp_orchestrator_params.yaml's w_nullspace_pos
    # (nullspace_vel_damping was tried here, bag 20260902_092617 -- doubled
    # the posture drift, reverted; superseded by nullspace_pos_damping.)

terminal_model:
  class: IAMSoftContactAugmented
  # See running_model — gated |f| box.
  force_lb: [-15.0]
  force_ub: [15.0]
  differential:
    class: DAMSoftContactAugmentedFwdDynamics
    # See running_model.differential — sized to 1, not 3 (1D contact).
    Kp: [4000]
    Kv: [400]
    frame_id: wrist_right_ft_sensor_link
    oPc: [0.0, 0.0, 0.187928]
    with_gravity_torque_reg: false
    # See running_model.differential — same 1D tool-axis contact.
    enabled_directions: [false, false, true]
    ref: LOCAL
    cost_ref: LOCAL
    costs:
    - name: state_reg
      update: true
      weight: 1.0
      cost:
        class: CostModelResidual
        activation:
          class: ActivationModelWeightedQuad
          weights: 1.0
        residual:
          class: ResidualModelState
    - name: frame_trans_tracking_tool
      update: true
      weight: 1.0
      cost:
        class: CostModelResidual
        activation:
          class: ActivationModelWeightedQuad
          weights: 1.0
        residual:
          class: ResidualModelFrameTranslationStatic
          frame_id: gripper_right_tool_holder
    - name: frame_rot_tracking_tool
      update: true
      weight: 1.0
      cost:
        class: CostModelResidual
        activation:
          class: ActivationModelWeightedQuad
          weights: 1.0
        residual:
          class: ResidualModelFrameRotationStatic
          frame_id: gripper_right_tool_holder
    - name: nullspace_pos_damping
      update: true
      weight: 1.0
      cost:
        class: CostModelResidual
        activation:
          class: ActivationModelWeightedQuad
          weights: 1.0
        residual:
          class: ResidualModelNullspacePosition
          frame_id: gripper_right_tool_holder
          damping: 1.0e-3
          weight: 30.0  # fallback, overridden by hpp_orchestrator_params.yaml's w_nullspace_pos
    constraints:
      # arm_right_3_link_sc vs pylone capsules
    - name: collision_arm3_pyl0
      active: false
      constraint:
        class: ConstraintModelResidual
        lower: 0.001
        upper: inf
        residual:
          class: ResidualDistanceCollision
          collision_pair: [arm_right_3_link_sc_capsule_0, pylone_sc_link_capsule_0]
    - name: collision_arm3_pyl1
      active: false
      constraint:
        class: ConstraintModelResidual
        lower: 0.001
        upper: inf
        residual:
          class: ResidualDistanceCollision
          collision_pair: [arm_right_3_link_sc_capsule_0, pylone_sc_link_capsule_1]
    - name: collision_arm3_pyl2
      active: false
      constraint:
        class: ConstraintModelResidual
        lower: 0.001
        upper: inf
        residual:
          class: ResidualDistanceCollision
          collision_pair: [arm_right_3_link_sc_capsule_0, pylone_sc_link_capsule_2]
    - name: collision_arm3_pyl3
      active: false
      constraint:
        class: ConstraintModelResidual
        lower: 0.001
        upper: inf
        residual:
          class: ResidualDistanceCollision
          collision_pair: [arm_right_3_link_sc_capsule_0, pylone_sc_link_capsule_3]
    - name: collision_arm3_pyl4
      active: false
