        upper: inf
        residual:
          class: ResidualDistanceCollision
          collision_pair: [arm_right_3_link_sc_capsule_0, pylone_sc_link_capsule_5]
      # arm_right_5_link_sc vs pylone capsules
    - name: collision_arm5_pyl0
