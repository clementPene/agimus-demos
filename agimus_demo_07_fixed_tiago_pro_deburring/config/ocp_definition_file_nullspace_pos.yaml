---
# Same as ocp_definition_file.yaml (production, augmented [q,v,f] state,
# guarded-move soft-contact dynamics), plus one extra cost:
# nullspace_pos_damping (ResidualModelNullspacePosition, new 2026-09-09,
# real-robot-confirmed on the non-augmented variant 2026-09-10 -- see
# ocp_definition_file_nonaugmented_nullspace_pos.yaml, ~49% terminal-drift
# reduction there). Ported here on top of the augmented dynamics: the
# residual reads state.nv/state.pinocchio.nq, which StateSoftContact sets
# to the plain robot's 7/7 (not the augmented 15), and only ever touches
# the q-slice of x / the first nq columns of Rx -- so it should be
# augmented-state-safe by construction (checked against force_feedback_mpc's
# state.cpp, not yet run against this exact file).
#
# `weight: 30.0` is unchanged/untuned from the non-augmented test -- the
# augmented dynamics (stiffer effective response near contact) may call for
# a different value.
#
# OCP definition for the TIAGo Pro deburring demo.
# Task-space priority: frame tracking dominates, state_reg is a first guess only.

running_model:
  class: IAMSoftContactAugmented
  # |f| box constraint, tool z (N). Re-added 2026-08-28 with the two fixes
  # the 20260827_151542 divergence needed:
  #  - GATED: agimus_controller enables it (iam.with_force_constraint) only
  #    while the sensor reports contact (contact.active, itself quasi-static
  #    gated). While off, f is frozen/decoupled and unconstrained, so a
  #    noisy x0.f can't be an unfixable infeasibility.
  #  - x0.f is hard-clamped (_CONTACT_FORCE_CLAMP_N) before it enters the state.
  # Low for the first robot test — raise once behaviour is confirmed.
  force_lb: [-15.0]
  force_ub: [15.0]
  differential:
    class: DAMSoftContactAugmentedFwdDynamics
    # Soft contact model. Kp=9000/Kv=300 (not Franka's placeholders
    # Kp=6000/Kv=100) — matches the standalone tiago_pro_force_mpc_sim
    # MuJoCo testbed's "current best result" config.yaml. Kv in particular
    # was found there to be the single biggest lever (Kv=100 gave a
    # sharp/non-monotonic weight landscape; Kv=300 made every other
    # cost-weight sweep smooth and monotonic — see that project's NOTES.md).
    # Still simulation-derived, not re-tuned against the real contact —
    # start cautious on robot.
    # Sized to 1 (not 3, unlike Franka's 3D config): with enabled_directions
    # summing to 1, ocp_croco_generic_force_feedback.py's _dam_cls_and_kwargs
    # switches to force_feedback_mpc.DAMSoftContact1DAugmentedFwdDynamics,
    # which requires Kp/Kv of size 1 — passed through from here unsliced, no
    # Python-side truncation happens. Missing this crashed
    # DAMSoftContactAbstractAugmentedFwdDynamics's C++ constructor with
    # "Kp and Kv must have size 1" (2026-08-21).
    Kp: [4000]
    Kv: [400]
    # Must match force_sensor_filter.py's contact_name / agimus_controller.py's
    # _FORCE_CONTACT_NAME (project_demo07_force_feedback_scoping memory).
    frame_id: wrist_right_ft_sensor_link
    # Contact point = tool tip, computed via FK from the real URDF (2026-08-20):
    # wrist_right_ft_sensor_link -> gripper_right_tool_holder = 0.147928m (z,
    # identity rotation) + 0.04m tool length (Ø40x40mm pal-atc deburring bit).
    # NOT the same as the calibrated com_xyz (mass-weighted CoM, dominated by
    # the pal-atc coupler close to the sensor) — this is the geometric contact
    # point at the far end of the tool.
    oPc: [0.0, 0.0, 0.187928]
    # OFF here: the control_reg cost below (ResidualModelControlGrav) now
    # carries the torque->g(q) regularisation, exactly as the healthy
    # non-augmented yaml does. Keeping both would double-weight the same
    # u->g(q) pull. (2026-09-10, debugging bag 20260910_132804's divergence.)
    with_gravity_torque_reg: false
    # 1D contact along the tool's own pushing axis (confirmed with Clément
    # 2026-08-21) — this is wrist_right_ft_sensor_link's local z (verified by
    # FK: gripper_right_tool_holder sits at identity rotation from the sensor
    # frame, i.e. the whole tool-mount chain extends along that same local
    # z). Needs ref: LOCAL (not LOCAL_WORLD_ALIGNED) for "z" to mean the
    # tool's pushing direction rather than world-vertical, which would only
    # coincide with the real contact direction if the wrist happened to be
    # perfectly vertical during insertion.
    enabled_directions: [false, false, true]
    ref: LOCAL
    cost_ref: LOCAL
    costs:
    - name: state_reg
      update: true
      weight: 1.0
      cost:
        class: CostModelResidual
        activation:
          class: ActivationModelWeightedQuad
          weights: 1.0
        residual:
          class: ResidualModelState
    # Torque regularisation toward g(q) (NOT toward zero -- that's
    # ResidualModelControl, which fights the gravity-hold torque the OCP
    # must produce at rest). This is the 2026-09-02 fix that made the
    # non-augmented OCP well-conditioned (solver 1 iter, chatter -60%);
    # added here 2026-09-10 to test whether its absence is what makes the
    # augmented OCP's prediction diverge (bag 20260910_132804). `ControlGrav`
    # regularises toward the SAME reference as with_gravity_torque_reg, so
    # that DAM flag is turned OFF above (no double-count) -- unlike the
    # torque-toward-zero combo the testbed found breaks force tracking.
    - name: control_reg
      update: true
      weight: 1.0
      cost:
        class: CostModelResidual
        activation:
          class: ActivationModelWeightedQuad
          weights: 1.0
        residual:
          class: ResidualModelControlGrav
    - name: frame_trans_tracking_tool
      update: true
      weight: 1.0
      cost:
        class: CostModelResidual
        activation:
          class: ActivationModelWeightedQuad
          weights: 1.0
        residual:
          class: ResidualModelFrameTranslationStatic
          frame_id: gripper_right_tool_holder
    - name: frame_rot_tracking_tool
      update: true
      weight: 1.0
      cost:
        class: CostModelResidual
        activation:
          class: ActivationModelWeightedQuad
          weights: 1.0
        residual:
          class: ResidualModelFrameRotationStatic
          frame_id: gripper_right_tool_holder
    # New lever under test (see ocp_croco_generic.py's
    # ResidualModelNullspacePosition docstring): pulls the redundant DOF
    # toward the planned reference posture, restricted to the null space of
    # the tool frame's Jacobian.
    - name: nullspace_pos_damping
      update: true
      weight: 1.0
      cost:
        class: CostModelResidual
        activation:
          class: ActivationModelWeightedQuad
          weights: 1.0
        residual:
          class: ResidualModelNullspacePosition
          frame_id: gripper_right_tool_holder
          damping: 1.0e-3
          weight: 30.0  # fallback, overridden by hpp_orchestrator_params.yaml's w_nullspace_pos
    # NOTE: `nullspace_vel_damping` (ResidualModelNullspaceVelocity) was tested
    # here (bag 20260902_092617) — it halved the phantom velocity but doubled the
    # redundant-DOF posture drift (0.20 -> 0.43 rad) and cost +2.4 ms solve.
    # Reverted; superseded by nullspace_pos_damping above.

terminal_model:
  class: IAMSoftContactAugmented
  # See running_model — gated |f| box.
  force_lb: [-15.0]
  force_ub: [15.0]
  differential:
    class: DAMSoftContactAugmentedFwdDynamics
    # See running_model.differential — sized to 1, not 3 (1D contact).
    Kp: [4000]
    Kv: [400]
    frame_id: wrist_right_ft_sensor_link
    oPc: [0.0, 0.0, 0.187928]
    with_gravity_torque_reg: false
    # See running_model.differential — same 1D tool-axis contact.
    enabled_directions: [false, false, true]
    ref: LOCAL
    cost_ref: LOCAL
    costs:
    - name: state_reg
      update: true
      weight: 1.0
      cost:
        class: CostModelResidual
        activation:
          class: ActivationModelWeightedQuad
          weights: 1.0
        residual:
          class: ResidualModelState
    - name: frame_trans_tracking_tool
      update: true
      weight: 1.0
      cost:
        class: CostModelResidual
        activation:
          class: ActivationModelWeightedQuad
          weights: 1.0
        residual:
          class: ResidualModelFrameTranslationStatic
          frame_id: gripper_right_tool_holder
    - name: frame_rot_tracking_tool
      update: true
      weight: 1.0
      cost:
        class: CostModelResidual
        activation:
          class: ActivationModelWeightedQuad
          weights: 1.0
        residual:
          class: ResidualModelFrameRotationStatic
          frame_id: gripper_right_tool_holder
    - name: nullspace_pos_damping
      update: true
      weight: 1.0
      cost:
        class: CostModelResidual
        activation:
          class: ActivationModelWeightedQuad
          weights: 1.0
        residual:
          class: ResidualModelNullspacePosition
          frame_id: gripper_right_tool_holder
          damping: 1.0e-3
          weight: 30.0  # fallback, overridden by hpp_orchestrator_params.yaml's w_nullspace_pos
    constraints:
      # arm_right_3_link_sc vs pylone capsules
    - name: collision_arm3_pyl0
      active: false
      constraint:
        class: ConstraintModelResidual
        lower: 0.001
        upper: inf
        residual:
          class: ResidualDistanceCollision
          collision_pair: [arm_right_3_link_sc_capsule_0, pylone_sc_link_capsule_0]
    - name: collision_arm3_pyl1
      active: false
      constraint:
        class: ConstraintModelResidual
        lower: 0.001
        upper: inf
        residual:
          class: ResidualDistanceCollision
          collision_pair: [arm_right_3_link_sc_capsule_0, pylone_sc_link_capsule_1]
    - name: collision_arm3_pyl2
      active: false
      constraint:
        class: ConstraintModelResidual
        lower: 0.001
        upper: inf
        residual:
          class: ResidualDistanceCollision
          collision_pair: [arm_right_3_link_sc_capsule_0, pylone_sc_link_capsule_2]
    - name: collision_arm3_pyl3
      active: false
      constraint:
        class: ConstraintModelResidual
        lower: 0.001
        upper: inf
        residual:
          class: ResidualDistanceCollision
          collision_pair: [arm_right_3_link_sc_capsule_0, pylone_sc_link_capsule_3]
    - name: collision_arm3_pyl4
      active: false
      constraint:
        class: ConstraintModelResidual
        lower: 0.001
        upper: inf
        residual:
          class: ResidualDistanceCollision
          collision_pair: [arm_right_3_link_sc_capsule_0, pylone_sc_link_capsule_4]
    - name: collision_arm3_pyl5
      active: false
