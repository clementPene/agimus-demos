---
# HPP orchestrator parameters for the TIAGo Pro deburring demo.
#
# HPP plans full-body (base + arm). The base trajectory is executed by
# base_trajectory_follower. The arm trajectory goes to the fixed-base MPC.
#
# MPC state space (nv=7): 7 right arm joints
# MPC config space (nq=7): 7 right arm joints

# ── Trajectory sampling ───────────────────────────────────────────────────────
trajectory:
  dt: 0.01          # sampling period (s) — must match agimus_controller rate
  time_scale: 1.0   # stretch HPP path time — increase to slow down execution

# ── Handle (hole_tiago_25 on right face of pylone) ───────────────────────────
handle:
  link: "pylone/pylone_link"
  name: "pylone/hole_tiago_25"
  position: [0.0, -0.213, 0.0]   # center of right face, z=0
  clearance: 0.05

# ── Arm tuck configurations ───────────────────────────────────────────────────
tuck:
  left_arm:  [0.5, -1.83, -0.47, -2.35, 0.0, -1.2, 0.0]
  right_arm: [-0.5, -1.83, 0.47, -2.35, 0.0, -1.2, 0.0]

# ── MPC weights (arm only, 7 DoF) ─────────────────────────────────────────────
weights:
  w_q:           [0.12, 0.12, 0.12, 0.12, 0.12, 0.12, 0.12]
  w_qdot:        [0.05, 0.05, 0.05, 0.05, 0.05, 0.05, 0.05]
  w_qddot:       [0.08, 0.08, 0.08, 0.08, 0.08, 0.08, 0.08]
  w_effort:      [0.006, 0.006, 0.006, 0.006, 0.006, 0.006, 0.006]
  w_collision:   0.0
  w_frame_trans: [1000.0, 1000.0, 1000.0]
  w_frame_rot:   [60.0, 60.0, 60.0]

# ── Base trajectory follower ──────────────────────────────────────────────────
base_follower:
  lookahead_dist: 0.08    # advance to next waypoint when within this distance (m)
  kp_linear: 1.5          # P gain for linear velocity (m/s per m)
  kp_angular: 2.0         # P gain for angular velocity (rad/s per rad)
  max_linear_vel: 0.4     # m/s
  max_angular_vel: 0.8    # rad/s
