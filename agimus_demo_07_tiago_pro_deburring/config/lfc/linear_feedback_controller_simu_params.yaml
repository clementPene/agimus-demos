---
# LFC simulation params for demo 07 (TIAGo Pro full body — planar base + right arm).
# Compared to agimus_demos_common, adds robot_has_free_flyer: true so the
# sensor message carries base_pose / base_twist, which sensor_ff_to_planar_state
# needs to build x0 for the MPC.
linear_feedback_controller:
  ros__parameters:
    type: linear_feedback_controller/LinearFeedbackController
    chainable_controller:
      command_interfaces:
        - arm_right_1_joint_inertia_shaping_controller/arm_right_1_joint/effort
        - arm_right_2_joint_inertia_shaping_controller/arm_right_2_joint/effort
        - arm_right_3_joint_inertia_shaping_controller/arm_right_3_joint/effort
        - arm_right_4_joint_inertia_shaping_controller/arm_right_4_joint/effort
        - arm_right_5_joint_inertia_shaping_controller/arm_right_5_joint/effort
        - arm_right_6_joint_inertia_shaping_controller/arm_right_6_joint/effort
        - arm_right_7_joint_inertia_shaping_controller/arm_right_7_joint/effort
    reference_prefix: linear_feedback_controller
    moving_joint_names:
      - arm_right_1_joint
      - arm_right_2_joint
      - arm_right_3_joint
      - arm_right_4_joint
      - arm_right_5_joint
      - arm_right_6_joint
      - arm_right_7_joint
    arm_right_1_joint:
      p: 50.0
      d: 0.5
    arm_right_2_joint:
      p: 50.0
      d: 0.5
    arm_right_3_joint:
      p: 50.0
      d: 0.5
    arm_right_4_joint:
      p: 50.0
      d: 0.5
    arm_right_5_joint:
      p: 10.0
      d: 0.3
    arm_right_6_joint:
      p: 5.0
      d: 0.3
    arm_right_7_joint:
      p: 5.0
      d: 0.3
    robot_has_free_flyer: true
    remove_gravity_compensation_effort: false
    joint_velocity_filter_coefficient: 0.9
    pd_to_lf_transition_duration: 0.5
